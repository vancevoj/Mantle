# canPassThrough AND isWaterHole are intentionally NOT widened: Lithium @Overwrites BOTH of them with private
# visibility (see lithium FlowingFluidMixin), and widening a target to protected makes that @Overwrite fail to
# apply ("cannot reduce visibility of PROTECTED target method"), which rejects the entire lithium FlowingFluidMixin.
# InvertedFluid reimplements both as private local helpers (built from the safe-to-widen methods below) instead.
# The methods below are @Shadow'd (not @Overwrite'd) by Lithium and Lithium widens them to protected via its own
# access widener, so widening them here stays compatible with Lithium.
