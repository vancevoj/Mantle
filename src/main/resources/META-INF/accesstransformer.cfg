protected net.minecraft.world.level.material.FlowingFluid canHoldFluid(Lnet/minecraft/world/level/BlockGetter;Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/material/Fluid;)Z
protected net.minecraft.world.level.material.FlowingFluid isSourceBlockOfThisType(Lnet/minecraft/world/level/material/FluidState;)Z
protected net.minecraft.world.level.material.FlowingFluid affectsFlow(Lnet/minecraft/world/level/material/FluidState;)Z
