# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NeoForm decompiles Minecraft on first run and needs headroom.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# NeoForge 1.21.1 port of Mantle; mod_version tracks the upstream Mantle version it derives from.
mod_version=1.21.0
# fork_version is THIS fork's release number; bump it every published release (1.0 -> 1.1 -> 1.2 ...).
# Final version string and jar name = <minecraft_version>-<mod_version>-v<fork_version>.
# 1.23-dev: fixes the v1.22-dev startup crash, the StringRepresentable mixin must be an INTERFACE mixin
# (StringRepresentable is an interface) and the config is now non-required so a mixin hiccup degrades gracefully.
# 1.24-dev: ItemNameIngredient.test now resolves names instead of throwing (neotinkers #5, Twilight Forest smeltery
# crash); JEI multi-recipe expansion guarded; recipe serializer network errors wrapped for clearer disconnects;
# InventoryBlock use mirrors vanilla chest. Ports upstream Mantle 1.20 fixes.
# 1.25: FULL release. Promotes the v1.21 through v1.24-dev line (JEI re-enable, Lithium FlowingFluid compat, the
# v1.22-dev StringRepresentable startup-crash fix, ItemNameIngredient smeltery crash fix, JEI/network hardening) to a
# full release. No code change over v1.24-dev; pairs with Neo Tinkers v1.29.
fork_version=1.25

# Minecraft Version Information
minecraft_version=1.21.1
minecraft_range=[1.21.1,1.21.2)

# NeoForge Version Information
# loader_range tracks the FML version, not the NeoForge version.
loader_range=[4,)
neoforge_version=21.1.233
neoforge_range=[21.1.0,)

# Parchment mappings for 1.21.1
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Build dependencies (NeoForge JEI for 1.21.1; only needed once the plugin package is ported)
jei_version=19.21.0.247
